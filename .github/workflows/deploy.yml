name: Deploy to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: aws-actions/setup-sam@v2

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - run: sam build

      - name: Deploy to AWS
        env:
          PARAM_DB_URL: ${{ secrets.DATABASE_URL }}
          PARAM_ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          PARAM_JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          PARAM_GH_OAUTH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          PARAM_GH_OAUTH_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          PARAM_GH_APP_ID: ${{ secrets.GH_APP_ID }}
          PARAM_GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          PARAM_GH_WEBHOOK_SECRET: ${{ secrets.GH_WEBHOOK_SECRET }}
          PARAM_LINEAR_CLIENT_ID: ${{ secrets.LINEAR_CLIENT_ID }}
          PARAM_LINEAR_CLIENT_SECRET: ${{ secrets.LINEAR_CLIENT_SECRET }}
          PARAM_LINEAR_REDIRECT_URI: ${{ secrets.LINEAR_REDIRECT_URI }}
          PARAM_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PARAM_FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        run: |
          OVERRIDES="DatabaseUrl=$PARAM_DB_URL"
          OVERRIDES="$OVERRIDES EncryptionKey=$PARAM_ENCRYPTION_KEY"
          [ -n "$PARAM_JWT_SECRET_KEY" ]       && OVERRIDES="$OVERRIDES JwtSecretKey=$PARAM_JWT_SECRET_KEY"
          [ -n "$PARAM_GH_OAUTH_CLIENT_ID" ]   && OVERRIDES="$OVERRIDES GitHubOAuthClientId=$PARAM_GH_OAUTH_CLIENT_ID"
          [ -n "$PARAM_GH_OAUTH_CLIENT_SECRET" ] && OVERRIDES="$OVERRIDES GitHubOAuthClientSecret=$PARAM_GH_OAUTH_CLIENT_SECRET"
          [ -n "$PARAM_GH_APP_ID" ]            && OVERRIDES="$OVERRIDES GitHubAppId=$PARAM_GH_APP_ID"
          [ -n "$PARAM_GH_APP_PRIVATE_KEY" ]   && OVERRIDES="$OVERRIDES GitHubAppPrivateKey=$PARAM_GH_APP_PRIVATE_KEY"
          [ -n "$PARAM_GH_WEBHOOK_SECRET" ]    && OVERRIDES="$OVERRIDES GitHubWebhookSecret=$PARAM_GH_WEBHOOK_SECRET"
          [ -n "$PARAM_LINEAR_CLIENT_ID" ]     && OVERRIDES="$OVERRIDES LinearClientId=$PARAM_LINEAR_CLIENT_ID"
          [ -n "$PARAM_LINEAR_CLIENT_SECRET" ]  && OVERRIDES="$OVERRIDES LinearClientSecret=$PARAM_LINEAR_CLIENT_SECRET"
          [ -n "$PARAM_LINEAR_REDIRECT_URI" ]  && OVERRIDES="$OVERRIDES LinearRedirectUri=$PARAM_LINEAR_REDIRECT_URI"
          [ -n "$PARAM_ANTHROPIC_API_KEY" ]    && OVERRIDES="$OVERRIDES AnthropicApiKey=$PARAM_ANTHROPIC_API_KEY"
          [ -n "$PARAM_FRONTEND_URL" ]         && OVERRIDES="$OVERRIDES FrontendUrl=$PARAM_FRONTEND_URL"

          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides $OVERRIDES
